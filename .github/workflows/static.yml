name: Deploy Raylib C++ Project to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # Instructs the runner to allow actions utilizing older Node versions during the transition
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Updated to v4.2.2 or later to align with Node 24 standards
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev libasound2-dev

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Download Raylib WebAssembly Library
        run: |
          curl -sL https://github.com -o raylib_web.zip
          mkdir -p raylib_wasm
          unzip -o raylib_web.zip -d raylib_wasm/

      - name: Compile C++ to WebAssembly with Raylib
        run: |
          mkdir -p build_site
          LIB_DIR=$(find raylib_wasm -type d -name "lib" | head -n 1)
          INC_DIR=$(find raylib_wasm -type d -name "include" | head -n 1)
          
          # Added SINGLE_FILE=1 to merge HTML, JS, and WASM into one deliverable page
          emcc main.cpp -o build_site/index.html \
            -I$INC_DIR -L$LIB_DIR -lraylib \
            -s USE_GLFW=3 -s WASM=1 \
            -s SINGLE_FILE=1 \
            --preload-file Images@Images \
            -s ALLOW_MEMORY_GROWTH=1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
