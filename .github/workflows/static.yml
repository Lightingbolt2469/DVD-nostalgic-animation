name: Deploy Raylib C++ Project to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Clone and Build Raylib for Web
        run: |
          git clone --depth 1 https://github.com/raysan5/raylib.git raylib_src
          cd raylib_src/src
          make PLATFORM=PLATFORM_WEB EMSDK_PATH="$EMSDK" -B
          cp libraylib.web.a libraylib.a

      - name: Compile C++ to WebAssembly with Raylib
        run: |
          mkdir -p build_site
          emcc main.cpp -o build_site/index.html \
            -I raylib_src/src -L raylib_src/src -lraylib \
            -s USE_GLFW=3 -s WASM=1 \
            -s SINGLE_FILE=1 \
            -s ASYNCIFY \
            --preload-file Images@Images \
            -s ALLOW_MEMORY_GROWTH=1 \
            --shell-file raylib_src/src/minshell.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
